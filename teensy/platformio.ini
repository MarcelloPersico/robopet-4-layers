; Teensy 4.1 firmware for the robot desk pet body.
; PlatformIO + Teensyduino Arduino core. Plan §6.

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 921600
upload_protocol = teensy-cli
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    paulstoffregen/Encoder@^1.4.4
build_flags =
    -DUSB_SERIAL
    -O2
