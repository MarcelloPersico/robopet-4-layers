[project]
name = "pet-desktop"
version = "0.1.0"
description = "Desktop orchestrator for the robot desk pet."
requires-python = ">=3.11,<3.13"
dependencies = [
    "websockets>=13",
    "faster-whisper>=1.1",
    "transformers>=4.45",
    "torch>=2.4",
    "accelerate>=0.34",
    "Pillow>=10",
    "numpy>=1.26",
    "sounddevice>=0.5",
    "httpx>=0.27",
    "anyio>=4",
    "mcp>=1.0",
    "win10toast-click>=0.1.2; sys_platform == 'win32'",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
