[project]
name = "pet-desktop"
version = "0.1.0"
description = "Desktop orchestrator for the robot desk pet."
requires-python = ">=3.11,<3.13"
dependencies = [
    "websockets>=13",
    "faster-whisper>=1.1",
    "transformers>=4.45",
    "torch>=2.4",
    "accelerate>=0.34",
    "Pillow>=10",
    "numpy>=1.26",
    "sounddevice>=0.5",
    "httpx>=0.27",
    "anyio>=4",
    "mcp>=1.0",
    "win10toast-click>=0.1.2; sys_platform == 'win32'",
    "tomli>=2; python_version < '3.11'",
    # Optional neural TTS backend ([tts] backend = "kokoro"); lazy-imported.
    "kokoro>=0.9",
    # Local sentence embeddings for the cognition memory stream (Plan §12). Core
    # because cognition is on by default; lazy-imported in embeddings.py so the
    # lint/test .venv (which doesn't pip-install this project) never loads it.
    "sentence-transformers>=3.0",
    # GPU ASR: ctranslate2's CUDA-12 build needs these runtime libs (cublas64_12,
    # cuDNN 9). asr.py registers their DLL dirs when device='cuda' on Windows.
    "nvidia-cublas-cu12; sys_platform == 'win32'",
    "nvidia-cudnn-cu12; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]
# Optional: advertise the dashboard as <name>.local over mDNS (dashboard.py --mdns-name).
# Lazy-imported — without it the dashboard still runs, just reachable by IP instead of a name.
mdns = [
    "zeroconf>=0.130",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
