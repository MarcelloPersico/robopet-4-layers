# Desktop orchestrator configuration.
# Copy to config.local.toml for machine-specific overrides; config.local.toml is gitignored.

[wsserver]
host = "0.0.0.0"
port = 8765
ping_interval_s = 2.0
ping_timeout_s = 10.0

[asr]
model = "large-v3-turbo"
compute_type = "int8_float16"
device = "cuda"
vad_filter = false  # VAD runs on the Pi

[vlm]
# Vision backend for the see() tool:
#   "split"   -> a dedicated VLM (model below, Moondream) captions each frame;
#                the agent LLM reasons over that text. Most debuggable.
#   "unified" -> NO separate VLM. The agent LLM must itself be multimodal (e.g.
#                point [agent].model at a Qwen3-VL model in LM Studio): see()
#                hands it the raw JPEG and it sees pixels directly. Frees the
#                VLM's ~3GB VRAM and gives sharper, contextual vision, but the
#                LLM and vision share one model (less separable when debugging).
mode = "split"
model = "vikhyatk/moondream2"
device = "cuda"
dtype = "float16"

[agent]
# manage_server = true  -> we launch & own llama-server.exe (default, below).
# manage_server = false -> connect to an already-running OpenAI-compatible
#   server that owns the model itself. Point this at LM Studio to pick/swap
#   models from its UI: in config.local.toml set
#       [agent]
#       manage_server = false
#       port = 1234            # LM Studio's local server port
#       model = "your-loaded-model-id"   # as shown in LM Studio (or "local")
#   Then llama_server_exe / model_path / n_gpu_layers below are ignored.
manage_server = true
# llama.cpp server is launched as a subprocess by the orchestrator (managed mode).
llama_server_exe = "C:/tools/llama.cpp/llama-server.exe"
model_path = "C:/models/qwen2.5-7b-instruct-q4_k_m.gguf"
host = "127.0.0.1"
port = 8080
# Model id sent in the API request. llama.cpp ignores it; LM Studio uses it to
# select which loaded model answers (set it to the id LM Studio shows).
model = "local"
n_gpu_layers = 99
ctx_size = 8192
parallel = 1
temperature = 0.7
# Stream the reply so spoken sentences start playing before the LLM finishes a
# long answer (Plan §5.6). Set false to wait for the full reply, then speak.
stream = true
# Reasoning hint sent on every chat completion (OpenAI-compatible). "none" tells a
# reasoning-capable server (LM Studio, recent llama.cpp) to skip the chain-of-thought
# and answer directly. The pet wants terse tool calls and the streaming loop discards
# any reasoning_content, so thinking is pure latency here (≈3× slower turns). Set to
# "low"/"medium"/"high" only for a model that benefits; "" omits the field entirely.
reasoning_effort = "none"

[tts]
# backend = "piper"  -> fast CPU subprocess voice (neutral). Default.
# backend = "kokoro" -> Kokoro-82M neural voice: far more natural, tiny (~0.3GB
#   on GPU, runs on CPU too). Needs `pip install kokoro` (model auto-downloads).
backend = "piper"
piper_exe = "C:/tools/piper/piper.exe"
voice_model = "C:/models/piper/en_US-amy-medium.onnx"
workers = 2
# Kokoro options (used when backend = "kokoro"):
kokoro_voice = "af_heart"   # e.g. af_heart, af_bella, am_michael, bf_emma (see model card)
kokoro_lang = "a"           # 'a' American English, 'b' British English
kokoro_device = "cuda"      # "cuda" or "cpu"

[mcp]
# http: in-process HTTP/SSE, bound on localhost for the inspector / remote
#       connectors (Claude Desktop via the mcp-remote bridge). Live only —
#       runs inside the orchestrator against the live robot + WorldState.
enable_http = true
http_host = "127.0.0.1"
http_port = 8770
http_bearer_token = "change-me-in-config.local.toml"

[queue]
db_path = "data/queue.sqlite"
frames_dir = "data/pending_frames"
recent_answers_max = 50
mention_threshold = 5  # agent may mention queue if unresolved >= this many

[notifier]
backend = "toast"  # one of: toast, webhook, silent
throttle_seconds = 600  # 10 minutes
webhook_url = ""

[paths]
persona = "persona.md"

[idle]
no_user_quiet_s = 30
default_intensity = 0.6

[face]
# Dual-OLED "eyes" face subsystem (Plan §6 face). Desktop-side defaults only;
# the authoritative real-time constants (bus clock, refresh, per-loop flush
# budget) live in the firmware's cfg::face namespace (Config.h). These mirror the
# firmware values for reference and let the agent/persona reason about the face.
default_emotion = "neutral"
idle_blink_min_ms = 2800   # min gap between autonomous idle blinks (mirrors cfg::face::IDLE_BLINK_MIN_MS)
idle_blink_max_ms = 6000   # max gap between autonomous idle blinks
bus_clock_hz = 1000000     # I2C FM+ (1 MHz); drop to 400000 on a marginal bus
refresh_hz = 30            # logical eye refresh cap (>=30 Hz feels smooth)

[dashboard]
# Read-only four-layer "Observatory" web dashboard (Plan §11 observability).
# OFF by default so the guarded emit() taps in the seam files stay pure no-ops
# and the running robot pays zero overhead. Flip enable=true in config.local.toml
# (or run `python dashboard.py` standalone with the built-in demo simulator).
# Localhost-only by default; read-only (no control surface). port 8772 avoids
# the wsserver (8765) / llama (8080) / MCP (8770) ports.
enable = false
host = "127.0.0.1"
port = 8772
mdns_name = ""             # set to e.g. "elena" to also advertise http://elena.local (needs the [mdns] extra)
replay = 200               # events replayed to a freshly-connected browser
ring_size = 500            # recent-events ring kept for replay
frame_max_bytes = 65536    # camera frames larger than this stream without a preview
frame_min_interval_s = 0.5 # per-key throttle for video/audio taps (~2 fps)

[cognition]
# The "alive" loop (Plan §12): a background internal monologue that thinks, emotes,
# learns, and occasionally speaks on its own between conversations. ON by default;
# set enable=false to fully disable it (kill switch). When on, it SUBSUMES the
# random [idle] loop. See desktop/COGNITION.md.
enable = true
tick_interval_s = 45.0      # base seconds between cognitive ticks (conservative on a 26B model;
                           #   lower it after switching to a smaller model — see COGNITION.md)
jitter_s = 15.0            # added random 0..jitter so ticks aren't metronomic
speak_cooldown_s = 180.0   # min seconds between spontaneous spoken remarks (Balanced)
speak_probability = 0.15   # chance a speak-eligible tick is actually allowed to speak (Balanced)
reflection_importance_threshold = 12.0  # summed new-memory importance that triggers a reflection
max_retrieved_memories = 5 # top-K memories injected per turn/tick (keep small — token budget)
sleep_hours = []           # e.g. [0,1,2,3,4,5,6] for sleepy eyes + no thinking/speaking at night

[memory]
# Persistent, ever-growing memory stream (separate from the queue DB). Stores
# dialogue, human-taught facts, and the robot's own thoughts/reflections — NOT raw
# camera frames (vision stays in-the-moment; enforced by not wiring a see()->memory
# hook). Embeddings via a small local model power relevance-scored recall.
db_path = "data/memory.sqlite"
embedding_model = "BAAI/bge-small-en-v1.5"  # 384-d, CPU-ok, lazy-loaded
device = "cpu"
recency_half_life_s = 21600  # 6h: how fast a memory's recency score fades
max_rows = 5000              # optional eviction ceiling (0 = keep everything); not auto-run yet
llm_rate_importance = false  # reserved: true = ask the model to rate importance (extra calls)
persist_vision = false       # locked decision; reserved flag (vision is never persisted today)

[mood]
# Persistent PAD affect: a slow tide that colors expression + generation (Plan §12).
half_life_s = 1800          # mood relaxes halfway toward baseline every 30 min
circadian = true            # gentle time-of-day baseline (calmer at night, brighter midday)
baseline_pleasure = 0.1     # the robot's resting good humor

# Model-swap / prompt-cache plumbing (managed llama.cpp ONLY; ignored by LM Studio).
# Frequent cognition ticks make caching worthwhile — see desktop/COGNITION.md. Add these
# under [agent] in config.local.toml when you move off LM Studio to a smaller GGUF model:
#   [agent]
#   model_path  = "C:/models/qwen3-8b-instruct-q4_k_m.gguf"
#   ctx_size    = 16384       # bigger context for memory-rich prompts
#   cache_reuse = 256         # llama.cpp prefix-cache reuse window (tokens)
#   cache_type_k = "q8_0"     # quantize the KV cache so a bigger ctx fits in 16 GB
#   cache_type_v = "q8_0"
#   flash_attn  = true        # required with a quantized V cache
#   slot_save_path = "data/llm_cache"   # persist/restore prompt-cache slots across restarts
