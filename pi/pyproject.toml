[project]
name = "pet-pi"
version = "0.1.0"
description = "Raspberry Pi Zero 2 W head: UART bridge + camera/mic capture."
requires-python = ">=3.11"
dependencies = [
    "websockets>=13",
    "pyserial-asyncio>=0.6",
    "opencv-python-headless>=4.10",
    "sounddevice>=0.5",
    "webrtcvad>=2.0.10",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
